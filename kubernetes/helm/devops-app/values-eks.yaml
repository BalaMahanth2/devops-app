# Amazon EKS in a short-lived sandbox account.
replicaCount: 1
appEnv: eks

service:
  # The sandbox deletes AWS load balancers, so the app is reached on a fixed
  # port of the nodes. scripts/aws-up.sh opens that port in the firewall.
  type: NodePort
  nodePort: 30080

database:
  # The sandbox cluster has no storage driver, so the database keeps its data
  # in the pod. It is lost when the pod restarts, which is fine for a 2-hour lab.
  persistence:
    enabled: false
