apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-app.fullname" . }}-migrate
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
  annotations:
    # First install: run after the database has been created.
    # Upgrades: run BEFORE the new app version rolls out.
    helm.sh/hook: post-install,pre-upgrade
    # A Job cannot be edited once created, so remove the old one before each run.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "devops-app.selectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flyway
          image: {{ .Values.migrate.image | quote }}
          args: ["migrate"]
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: POSTGRES_DB
            - name: FLYWAY_URL
              value: jdbc:postgresql://{{ include "devops-app.fullname" . }}-db:5432/$(POSTGRES_DB)
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: POSTGRES_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: FLYWAY_LOCATIONS
              value: filesystem:/flyway/sql
            - name: FLYWAY_CONNECT_RETRIES
              value: "60"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sql
              mountPath: /flyway/sql
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: sql
          configMap:
            name: {{ .Values.migrate.existingConfigMap }}
        - name: tmp
          emptyDir: {}
