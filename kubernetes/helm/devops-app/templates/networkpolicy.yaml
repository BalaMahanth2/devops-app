{{- if .Values.networkPolicy.enabled }}
# Database: only the web app and the migration job may connect. It may call nothing.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-app.fullname" . }}-db
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-app.selectorLabels" (dict "root" . "component" "database") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "devops-app.selectorLabels" (dict "root" . "component" "web") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "devops-app.selectorLabels" (dict "root" . "component" "migrate") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
---
# Web app: anyone may reach port 8080. It may only call the database and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-app.fullname" . }}-web
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-app.selectorLabels" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "devops-app.selectorLabels" (dict "root" . "component" "database") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Migration job: nothing may connect to it. It may only call the database and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "devops-app.fullname" . }}-migrate
  labels:
    {{- include "devops-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "devops-app.selectorLabels" (dict "root" . "component" "migrate") | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "devops-app.selectorLabels" (dict "root" . "component" "database") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
